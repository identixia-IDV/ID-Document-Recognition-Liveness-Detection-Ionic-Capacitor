// Consumes Identixia Document Reader AAR (same as ID-Document-Recognition-Liveness-Detection-Android).
// Drop documentfullsdk.aar here from the Android Drive folder / App export.
def aar = file("documentfullsdk.aar")
if (!aar.exists()) {
    throw new GradleException(
        "Missing example/android/libdocumentfullsdk/documentfullsdk.aar.\n" +
        "Copy it from ID-Document-Recognition-Liveness-Detection-Android/libdocumentfullsdk/ or the Drive Android pack."
    )
}
configurations.maybeCreate("default")
artifacts.add("default", aar)
